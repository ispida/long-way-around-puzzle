[project]
name = "lws"
version = "0.0.0"
description = "Long Way Around exact solver (OR-Tools CP-SAT). Reads the same content/ files as the game."
requires-python = ">=3.12,<3.14"
dependencies = [
    "ortools>=9.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lws"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
